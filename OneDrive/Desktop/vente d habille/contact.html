<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — VESTIAIRE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation du site -->
    <header class="site-header">
        <div class="wrap">
            <a href="index.html" class="logo">VESTIAIRE</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">ACCUEIL</a></li>
                    <li><a href="boutique.html">BOUTIQUE</a></li>
                    <li><a href="about.html">À PROPOS</a></li>
                    <li><a href="contact.html" class="active">CONTACT</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Section principale de la page Contact -->
    <main class="contact-page wrap">
        
        <header class="contact-header">
            <p class="subtitle">UNE QUESTION, UNE RETOUCHE, UN RETOUR</p>
            <h1>Contactez-nous</h1>
        </header>

        <div class="contact-grid">
            
            <!-- Colonne gauche : Formulaire de contact -->
            <form class="contact-form" action="#" method="POST">
                
                <div class="form-group">
                    <label for="name">NOM COMPLET</label>
                    <input type="text" id="name" name="name" placeholder="Votre nom" required>
                </div>

                <div class="form-group">
                    <label for="email">ADRESSE E-MAIL</label>
                    <input type="email" id="email" name="email" placeholder="vous@exemple.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">SUJET</label>
                    <select id="subject" name="subject" required>
                        <option value="" disabled selected>Choisir un sujet</option>
                        <option value="commande">Suivi de commande</option>
                        <option value="retours">Retours & Retouches</option>
                        <option value="autre">Autre demande</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">MESSAGE</label>
                    <textarea id="message" name="message" rows="5" placeholder="Votre message..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Envoyer le message</button>
            </form>

            <!-- Colonne droite : Informations boutique -->
            <aside class="contact-sidebar">
                
                <div class="info-block">
                    <h2>Boutique</h2>
                    <p>Avenue-Faidherbe</p>
                </div>

                <div class="info-block">
                    <h2>Horaires</h2>
                    <p>Lundi – Samedi, 10h – 19h</p>
                </div>

                <div class="info-block">
                    <h2>E-mail</h2>
                    <p>Vestiaire-shop221@gmail.com</p>
                </div>

            </aside>

        </div>

    </main>

    <!-- Pied de page -->
    <footer class="site-footer">
        <div class="wrap">
            <span class="logo">VESTIAIRE</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
