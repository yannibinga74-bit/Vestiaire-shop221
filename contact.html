<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — VESTIAIRE</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">VESTI<span>AIRE</span></a>
    <button class="nav-toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" id="mainNav">
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="boutique.html">Boutique</a></li>
        <li><a href="about.html">À propos</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<section>
  <div class="wrap">
    <div class="section-head">
      <div>
        <span class="section-eyebrow">Une question, une retouche, un retour</span>
        <h2>Contactez-nous</h2>
      </div>
    </div>

    <div class="contact-grid">
      <div>
        <form id="contactForm" novalidate>
          <div class="field" id="fieldName">
            <label for="name">Nom complet</label>
            <input type="text" id="name" name="name" placeholder="Votre nom">
            <span class="field-error" id="errorName"></span>
          </div>

          <div class="field" id="fieldEmail">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email" placeholder="vous@exemple.com">
            <span class="field-error" id="errorEmail"></span>
          </div>

          <div class="field" id="fieldSubject">
            <label for="subject">Sujet</label>
            <select id="subject" name="subject">
              <option value="">Choisir un sujet</option>
              <option value="commande">Suivi de commande</option>
              <option value="retour">Retour / échange</option>
              <option value="produit">Question produit</option>
              <option value="autre">Autre</option>
            </select>
            <span class="field-error" id="errorSubject"></span>
          </div>

          <div class="field" id="fieldMessage">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Votre message (10 caractères minimum)"></textarea>
            <span class="field-error" id="errorMessage"></span>
          </div>

          <button type="submit" class="btn btn-primary">Envoyer le message</button>
          <div class="form-status" id="formStatus"></div>
        </form>
      </div>

      <div>
        <div class="info-block" style="margin-top:0; border-top:none; padding-top:0;">
          <h3>Boutique</h3>
          <p style="color:#46423b;">Avenue-Faidherbe</p>
        </div>
        <div class="info-block">
          <h3>Horaires</h3>
          <p style="color:#46423b;">Lundi – Samedi, 10h – 19h</p>
        </div>
        <div class="info-block">
          <h3>E-mail</h3>
          <p style="color:#46423b;">Vestiaire-shop221@gmail.com</p>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span class="logo">VESTI<span>AIRE</span></span>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
